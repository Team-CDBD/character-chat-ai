# Local environment (plan P0): api + worker + PostgreSQL 16 with pgvector.
#   docker compose -f infra/docker-compose.yml up --build
#   python -m tools.mock_be demo --base-url http://localhost:8080
name: character-chat-ai

x-ai-env: &ai-env
  AI_DATABASE_URL: postgresql+asyncpg://ai:ai@db:5432/ai
  AI_SERVICE_TOKENS: '["local-dev-token"]'
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  AI_CHAT_MODEL:
  AI_EXTRACT_MODEL:
  AI_EMBEDDING_MODEL:
  AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-http://ollama:11434}
  AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
  # Optional: exact token counts for Gemma. Put tokenizer.json in ai-service/infra/local/ and set
  # AI_TOKENIZER_FILE=/srv/local/tokenizer.json (the folder is mounted read-only below).
  AI_TOKENIZER_FILE:
  # Optional: tuning overrides as a JSON file, e.g. AI_TUNING_FILE=/srv/local/tuning.json (docs/tuning.md)
  AI_TUNING_FILE:
  AI_REINDEX_INTERVAL_SECONDS:

services:
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes: [ollama-models:/root/.ollama]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 2s
      retries: 30
    volumes: [ai-db:/var/lib/postgresql/data]

  migrate:
    build: ..
    command: ["alembic", "upgrade", "head"]
    environment: *ai-env
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ..
    environment: *ai-env
    volumes: ["./local:/srv/local:ro"]
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ..
    command: ["python", "-m", "app.workers.runner"]
    environment: *ai-env
    volumes: ["./local:/srv/local:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  ollama-models:
  ai-db:
